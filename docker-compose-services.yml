version: "3.8"

services:
  # ============================================
  # Kafka Stack (KRaft Mode - Sin Zookeeper)
  # ============================================
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    platform: linux/arm64
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - shared-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo -n '' > /dev/tcp/127.0.0.1/9092"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 120s

  kafka-init:
    image: confluentinc/cp-kafka:latest
    container_name: kafka-init
    platform: linux/arm64
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Esperando a que Kafka esté completamente disponible...'
      sleep 10

      echo 'Creando tópicos...'
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic my-topico-capatrx-logs-dev --partitions 3 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic order-created --partitions 3 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic order-confirmed --partitions 3 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic order-cancelled --partitions 3 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic order-paid --partitions 3 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic payment-processed --partitions 3 --replication-factor 1
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 --topic payment-failed --partitions 3 --replication-factor 1

      echo 'Tópicos disponibles:'
      kafka-topics --list --bootstrap-server kafka:9092

      echo '✅ Kafka inicializado correctamente'
      echo '📊 Puedes acceder a Kafka UI en: http://localhost:9091'
      "
    networks:
      - shared-network
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    platform: linux/arm64
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9091:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - shared-network

  # ============================================
  # Message Brokers & Caching
  # ============================================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    platform: linux/arm64
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - shared-network

  redis:
    image: redis:latest
    container_name: redis
    platform: linux/arm64
    ports:
      - "6379:6379"
    networks:
      - shared-network

  # ============================================
  # Databases
  # ============================================
  postgres:
    image: postgres:latest
    container_name: postgres
    platform: linux/arm64
    volumes:
      - ./LocalEnviroment/postgres-scripts:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=d2b
    ports:
      - "5432:5432"
    networks:
      - shared-network

  mongo:
    image: mongo
    container_name: mongo
    platform: linux/arm64
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"
    networks:
      - shared-network

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    platform: linux/arm64
    depends_on:
      - mongo
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin
      ME_CONFIG_MONGODB_SERVER: mongo
    networks:
      - shared-network

  dynamodb:
    image: instructure/dynamo-local-admin
    container_name: dynamodb
    platform: linux/arm64
    ports:
      - "8010:8000"
    networks:
      - shared-network

  # ============================================
  # AWS LocalStack
  # ============================================
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    platform: linux/arm64
    ports:
      - "4566-4599:4566-4599"
      - "9000:9000"
    environment:
      - SERVICES=s3,kms,secretsmanager,kinesis,sqs,rds,transcribe,stepfunctions,lambda,batch,sns
      - DEFAULT_REGION=us-east-1
      - DATA_DIR=/tmp/localstack/data
      - PORT_WEB_UI=9000
      - LAMBDA_EXECUTOR=local
      - DOCKER_HOST=unix:///var/run/docker.sock
      - START_WEB=1
    networks:
      - shared-network

  mailhog:
    image: "mailhog/mailhog:latest"
    container_name: mailhog
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    environment:
      MH_STORAGE: "memory"

  mqnu0145001_iastacceleratorgateway_mr:
    image: ibm-mqadvanced-server-dev:9.4.4.0-arm64
    container_name: mqnu0145001_iastacceleratorgateway_mr_new
    healthcheck:
      test: ["CMD", "bash", "-c", "echo -n '' > /dev/tcp/127.0.0.1/1414"]
      interval: 15s
      timeout: 1m
      retries: 5
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: TESTQMGR
      MQ_ADMIN_PASSWORD: passw0rd
      MQ_APP_PASSWORD: passw0rd
    ports:
      - "1414:1414"
      - "9443:9443"
    volumes:
      - ./testEnvironment/mq/20-config.mqsc:/etc/mqm/20-config.mqsc:ro
    networks:
      - scf_mqnu0145001_iastacceleratorgateway_mr
    restart: unless-stopped

  mqnu0145001_iastacceleratorgateway_mr2:
    image: ibm-mqadvanced-server-dev:9.4.4.0-arm64
    container_name: mqnu0145001_iastacceleratorgateway_mr2_new
    healthcheck:
      test: ["CMD", "bash", "-c", "echo -n '' > /dev/tcp/127.0.0.1/1414"]
      interval: 30s
      timeout: 1m
      retries: 5
      start_period: 2m
    environment:
      LICENSE: accept
      MQ_QMGR_NAME: TESTQMGR2
    ports:
      - "1416:1414"
    command: >
      bash -c "
        /opt/mqm/bin/runmqdevserver &
        sleep 30
        echo 'DEFINE LISTENER(LISTENER.1416) TRPTYPE(TCP) PORT(1416) CONTROL(QMGR) REPLACE' | runmqsc TESTQMGR2
        echo 'START LISTENER(LISTENER.1416)' | runmqsc TESTQMGR2
        wait
      "
    networks:
      - scf_mqnu0145001_iastacceleratorgateway_mr
    restart: unless-stopped

  gonu0145001_iastacceleratorgateway_mr:
    platform: linux/arm64
    image: gonu0145001_iastacceleratorgateway_mr:test
    pull_policy: never
    container_name: gonu0145001_iastacceleratorgateway_mr_new
    healthcheck:
      test: ["CMD", "bash", "-c", "echo -n '' > /dev/tcp/127.0.0.1/8090"]
      interval: 15s
      timeout: 1m
      retries: 5
    depends_on:
      mqnu0145001_iastacceleratorgateway_mr:
        condition: service_healthy
    ports:
      - "8090:8090"
    networks:
      - scf_mqnu0145001_iastacceleratorgateway_mr
    restart: unless-stopped

  # ============================================
  # SFTP Server
  # ============================================
  sftp:
    image: atmoz/sftp:latest
    container_name: sftp
    platform: linux/amd64
    ports:
      - "2222:22"
    volumes:
      - ./sftp_keys:/home/sftpuser/.ssh/keys:ro
      - ./sftp_data:/home/sftpuser/upload
    command: sftpuser::1001
    networks:
      - shared-network

networks:
  shared-network:
    driver: bridge
  scf_mqnu0145001_iastacceleratorgateway_mr:
    driver: bridge
