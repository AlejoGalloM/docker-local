version: "3.8"
name: "d2b-tools"
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    platform: linux/arm64
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - shared-network

  mailhog:
    image: "mailhog/mailhog:latest"
    container_name: mailhog
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    environment:
      MH_STORAGE: "memory"

  sftp:
    image: atmoz/sftp:latest
    container_name: sftp
    ports:
      - "2222:22"
    volumes:
      - ../container-config/sftp-server-keys:/home/sftpuser/.ssh/keys:ro
      - ../sftp_data:/home/sftpuser/upload
    command: sftpuser::1001
    networks:
      - shared-network


networks:
  shared-network:
    name: d2b-shared-network
    external: true
