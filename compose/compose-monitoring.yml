version: "3.8"
name: "d2b-monitoring"

services:
  prometheus:
    image: prom/prometheus:v3
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../container-config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - shared-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ../container-config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - shared-network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - shared-network
    restart: unless-stopped

networks:
  shared-network:
    name: d2b-shared-network
    external: true
